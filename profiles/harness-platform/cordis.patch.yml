- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local:
        displayName: 业务模型
        api: openai-completions
        baseURL: http://172.16.138.233:8000/v1
        apiKeyEnv: LOCAL_LLM_API_KEY
        models:
          - id: Qwen3.8-27B
            name: Qwen3.8-27B
            contextWindow: 131072
            maxTokens: 8192
            reasoningEfforts: false

- id: agent-instructions
  config:
    projectRootMarkers: [".manager-workspace", ".git"]

- id: llm-openai-codex
  config:
    enableProxy: true
    proxyUrl: http://127.0.0.1:7897
    retryPolicy:
      mode: normal
      maxRetries: 10
      retryableCodes:
      - EMPTY_RESPONSE
      - RATE_LIMIT
      - SERVER
      - TIMEOUT
      - TRANSPORT

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: openai-codex
    model: gpt-6.1-sol
    reasoningEffort: max
