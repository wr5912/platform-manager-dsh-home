- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local-qwen:
        displayName: 业务模型
        api: openai-completions
        baseURL: http://172.16.138.233:8000/v1
        apiKeyEnv: LOCAL_LLM_API_KEY
        models:
          - id: Qwen3.8-27B
            name: Qwen3.8-27B
            contextWindow: 131072
            maxTokens: 8192
            reasoningEfforts: false

- id: agent-instructions
  config:
    projectRootMarkers: [ ".manager-workspace", ".git" ]

- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: codex
    model: gpt-6.2-sol
    reasoningEffort: xhigh
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: dsh-think-zh
  name: dsh-think-zh
  config:
    thinkingLanguage: zh
- id: llm-subscriptions
  config:
    providers: [ codex ]
